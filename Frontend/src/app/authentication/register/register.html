<div class="register-container">

  <div class="logo-section">
    <div>
      <h1 class="logo-uber">Uber</h1>
      <h1 class="logo-drinks">Drinks</h1>
    </div>
  </div>

  <div class="register-section">
    <div class="type-selection">
      <h2 class="register-title">Sign Up as: </h2>

      <div class="type-cards">
        <div class="type-card" (click)="selectUserType(UserRole.customer)">
          <h3>Customer</h3>
          <button class="btn-select">Register as Customer</button>
        </div>

        <div class="type-card" (click)="selectUserType(UserRole.restaurant)">
          <h3>Restaurant</h3>
          <button class="btn-select">Register as Restaurant</button>
        </div>
      </div>

      <p class="login-text">
        Already have an account? <a href="#" (click)="navigateToLogin($event)" class="login-link">Login</a>
      </p>
    </div>
  </div>
</div>
