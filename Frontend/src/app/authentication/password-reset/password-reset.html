<div class="login-container">

  <div class="logo-section">
    <div>
      <h1 class="logo-uber">Uber</h1>
      <h1 class="logo-drinks">Drinks</h1>
    </div>
  </div>

  <div class="login-section">
    <div>
      <h2 class="login-title">Reset your Password</h2>
      <p>You will receive an email with an link to reset your password</p>
      <form [formGroup]="loginForm" (submit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email"
            class="form-control"
          />
          @if (hasError('email', 'required')) {
            <span class="error-message">Email is required</span>
          }
        </div>

        <button type="submit" class="btn-login">Reset</button>

        <p class="signup-text">
          Already have an account? <a href="#" (click)="navigateToLogin($event)" class="signup-link">Login</a>
        </p>
      </form>
    </div>
  </div>

</div>
