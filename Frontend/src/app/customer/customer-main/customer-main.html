<div tabindex="0">
  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-uber">Uber</span>
        <span class="logo-drinks">Drinks</span>
      </div>

      <!-- Right side controls -->
      <div class="header-controls">
        <button class="search-btn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M14.294 13.364l4.387 4.386-1.414 1.414-4.386-4.387a8 8 0 111.413-1.413zM9 15A6 6 0 109 3a6 6 0 000 12z" fill="currentColor"/>
          </svg>
          <span>Search</span>
        </button>

        <div class="user-profile">
          <span class="user-name">Max Mustermann</span>
        </div>

        <button class="menu-toggle" [class.active]="isMenuOpen" (click)="toggleMenu()">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Overlay -->
  <div class="overlay"
       [class.active]="isMenuOpen"
       (click)="onOverlayClick()">
  </div>

  <!-- Slide-in Menu -->
  <nav class="slide-menu" [class.active]="isMenuOpen">
    <div class="menu-header">
      <h2 class="menu-title">Menu</h2>
      <button class="menu-close" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="menu-nav">
      <a href="#" class="nav-item active" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M18.06 22.99h1.66c.84 0 1.53-.64 1.63-1.46L23 5.05h-5V1h-1.97v4.05h-4.97l.3 2.34c1.71.47 3.31 1.32 4.27 2.26 1.44 1.42 2.43 2.89 2.43 5.29v8.05zM1 21.99V21h15.03v.99c0 .55-.45 1-1.01 1H2.01c-.56 0-1.01-.45-1.01-1zm15.03-7c0-8-15.03-8-15.03 0h15.03zM1.02 17h15v2h-15z" fill="currentColor"/>
        </svg>
        <span>Restaurants</span>
      </a>
      <a href="#" class="nav-item" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M17.21 9l-4.38-6.56c-.19-.28-.51-.42-.83-.42-.32 0-.64.14-.83.43L6.79 9H2c-.55 0-1 .45-1 1 0 .09.01.18.04.27l2.54 9.27c.23.84 1 1.46 1.92 1.46h13c.92 0 1.69-.62 1.93-1.46l2.54-9.27L23 10c0-.55-.45-1-1-1h-4.79zM9 9l3-4.4L15 9H9zm3 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="currentColor"/>
        </svg>
        <span>Orders</span>
      </a>
      <a href="#" class="nav-item" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="currentColor"/>
        </svg>
        <span>Profile</span>
      </a>
      <a href="#" class="nav-item" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="currentColor"/>
        </svg>
        <span>Help</span>
      </a>
      <a href="#" class="nav-item" (click)="closeMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" fill="currentColor"/>
        </svg>
        <span>Logout</span>
      </a>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Main Content -->
    <main class="main-content">
      <!-- Restaurants Section -->
      <section class="restaurants-section">
        <div class="section-header">
          <h2 class="section-title">Restaurants</h2>
          <button class="filter-btn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M7 6h10M7 10h7M7 14h4M3 6h.01M3 10h.01M3 14h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Filter
          </button>
        </div>

        <!-- Restaurant Grid -->
        <div class="restaurant-grid">
          <!-- Restaurant Card -->
          <div *ngFor="let restaurant of restaurants" class="restaurant-card">
            <div class="card-image">
              <img [src]="restaurant.image" [alt]="restaurant.name">
              <div class="cuisine-tags">
                <span *ngFor="let tag of restaurant.cuisineTags" class="tag">{{ tag }}</span>
              </div>
              <button class="favorite-btn">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
              </button>
            </div>
            <div class="card-content">
              <h3 class="restaurant-name">{{ restaurant.name }}</h3>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
