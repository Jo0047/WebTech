<div class="menu-header">
  <h1>Menu</h1>
  <button class="add-btn" routerLink="/restaurant/newProduct">
    + Add Item
  </button>
</div>

<div class="filter-bar">
  <label for="category-select">Filter by Category:</label>
  <select id="category-select" [(ngModel)]="selectedCategory">
    <option value="">All</option>
    <option value="soft drink">Soft drink</option>
    <option value="cocktail">Cocktail</option>
    <option value="beer">Beer</option>
    <option value="wine">Wine</option>
    <option value="coffee">Coffee</option>
    <option value="tea">Tea</option>

  </select>
</div>

<div class="drinks-grid">
  @for (product of filteredProducts; track product.drink_name) {
    <div class="drink-card">
      <h3>{{ product.drink_name }}</h3>
      <p>Category: {{ product.category }}</p>
      <p>Ingredients: {{ product.ingredients }}</p>
      <p>Alcoholic: <span>{{ product.alcoholic ? 'Yes' : 'No' }}</span></p>
      <p class="price">${{ product.price }}</p>
    </div>
  } @empty {
    <p>No drinks found for this category.</p>
  }
</div>
