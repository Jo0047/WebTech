<div class="form-wrapper">
  <div class="form-card">
    <h2>Add new drink</h2>

    <form [formGroup]="drinkForm" (ngSubmit)="submit()">

      <label>
        Drink name
        <input type="text" formControlName="drink_name" />
      </label>

      <label>
        Category
        <select formControlName="category">
          <option value="" disabled>Select category</option>
          @for (c of categories; track c) {
            <option value="{{ c }}">{{ c }}</option>
          }
        </select>
      </label>


      <label>
        Ingredients
        <textarea
          rows="3"
          formControlName="ingredients"
          placeholder="Optional"
        ></textarea>
      </label>

      <label class="checkbox">
        <input type="checkbox" formControlName="alcoholic" />
        Alcoholic
      </label>

      <label>
        Price (€)
        <input type="number" step="0.01" formControlName="price" />
      </label>

      <div class="actions">
        <button type="submit">Add drink</button>
      </div>

    </form>
  </div>
</div>
